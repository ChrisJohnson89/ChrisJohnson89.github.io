<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 / Incident Report</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11100d; color: #ece9df; padding: 1.5rem; }
      main { width: min(680px, 100%); border: 1px solid #77756c; }
      header { background: #ff5c35; color: #11100d; display: flex; justify-content: space-between; padding: .8rem 1rem; font-size: .7rem; }
      section { padding: clamp(2rem, 8vw, 5rem); }
      h1 { font: 400 clamp(4rem, 16vw, 9rem)/.8 Georgia, serif; margin: 0 0 2rem; }
      p { color: #aaa89f; line-height: 1.7; }
      a { display: inline-block; margin-top: 1rem; color: #c7ff2f; text-underline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <header><span>INCIDENT #404</span><span>SEVERITY: EMBARRASSING</span></header>
      <section>
        <h1>Page<br />escaped.</h1>
        <p>Root cause: the requested resource has left its assigned enclosure. No customer data was harmed. Probably.</p>
        <a href="/">← Return to stable infrastructure</a>
      </section>
    </main>
  </body>
</html>
