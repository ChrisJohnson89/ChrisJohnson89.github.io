<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 · Christopher Johnson</title>
  <style>
    :root {
      --ground: #f7f7f4; --ink: #17171a; --muted: #6e6e68; --accent: #1f3fd8;
      --hairline: rgba(23, 23, 26, 0.16);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--ground); color: var(--ink);
      font: 400 1rem/1.6 var(--sans); -webkit-font-smoothing: antialiased;
      min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
    }
    main { max-width: 560px; }
    .label {
      font: 500 0.68rem/1 var(--mono); letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted);
    }
    h1 { margin-top: 1rem; font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; }
    h1 span { color: var(--accent); }
    p { margin-top: 1.4rem; color: #3a3a38; }
    a.home {
      display: inline-block; margin-top: 2rem; color: var(--accent); font-weight: 500;
      font-size: 0.9rem; text-decoration: none;
      border-bottom: 1px solid var(--hairline); padding-bottom: 2px;
    }
    a.home:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="label">HTTP 404</p>
    <h1>This page does not <span>exist.</span></h1>
    <p>Which is unusual, because I spend most of my time making sure things stay up. Whatever you were looking for, it is not here.</p>
    <a class="home" href="/">Back to the homepage →</a>
  </main>
</body>
</html>
